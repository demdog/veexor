name: veexor
description: Veexor 家庭聊天助手，支持 Android 和 iOS
publish_to: none
version: 2.0.1+15
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  audioplayers: ^6.8.1
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter_image_compress: ^2.5.1
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
